name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, matching lakefile.toml (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kalari-release
  cancel-in-progress: false

jobs:
  green:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require successful main CI on this exact commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 - <<'PY'
          import os, tomllib
          with open("lakefile.toml", "rb") as source:
              assert tomllib.load(source)["version"] == os.environ["VERSION"]
          PY
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SHA" -f branch=main -f event=push -f status=success \
            --jq '.workflow_runs | length > 0' | grep -qx true
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$SHA"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  package:
    needs: green
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 15 \
            -o /tmp/elan-init.sh https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          rm -f /tmp/elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install build dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Pre-fetch Lean toolchain (retry flaky downloads)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if lake --version; then
              break
            elif [ "$i" -eq 5 ]; then
              echo "toolchain fetch failed after 5 attempts" >&2
              exit 1
            else
              sleep $((i * 5))
            fi
          done
      - name: Build release executables
        shell: bash
        run: |
          set -euo pipefail
          lake build kalari kalari-aashaan
      - name: Package Linux x86-64 archive
        env:
          VERSION: ${{ needs.green.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          name="kalari-$VERSION-linux-x86_64"
          mkdir -p "dist/$name/bin"
          install -m755 .lake/build/bin/kalari .lake/build/bin/kalari-aashaan "dist/$name/bin/"
          cp deploy/vultr/kalari.json.example deploy/vultr/session.json.example "dist/$name/"
          printf '%s\n' \
            'Install bin/kalari and bin/kalari-aashaan into a directory on PATH.' \
            'Requires Linux x86-64 with glibc 2.35 or newer.' \
            'Sandbox execution additionally requires Microsandbox and working KVM.' \
            'Configure Lambo, Vimanam, curl, API credentials and session paths before use.' \
            'The example JSON files require editing for your environment.' > "dist/$name/INSTALL.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ldd .lake/build/bin/kalari .lake/build/bin/kalari-aashaan > dist/runtime-libraries.txt
          ! grep -q 'not found' dist/runtime-libraries.txt
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Smoke check executables
        run: |
          .lake/build/bin/kalari --version
          ldd .lake/build/bin/kalari-aashaan
      - name: Verify compatibility with Ubuntu 22.04
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 512m \
            -v "$PWD/.lake/build/bin:/opt/kalari:ro" ubuntu:22.04 \
            sh -c 'set -eu; getconf GNU_LIBC_VERSION; /opt/kalari/kalari --version; /opt/kalari/kalari-aashaan 1000 1024 /bin/true' \
            > dist/compatibility.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path("dist/compatibility.txt").read_text().splitlines()
          verdict = json.loads(lines[-1])
          assert lines[0] == "glibc 2.35"
          assert verdict["verdict"] == "exited" and verdict["exit_code"] == 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/runtime-libraries.txt
            dist/compatibility.txt

  publish:
    needs: [green, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: dist
      - name: Publish draft for inspection
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.green.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --draft --title "Kalari $VERSION" \
            --notes "Linux x86-64 packages built on Ubuntu 24.04. Requires glibc 2.35 or newer. External tools and sandbox configuration are required." \
            dist/*
