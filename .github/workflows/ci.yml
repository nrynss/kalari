name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install elan (the toolchain comes from lean-toolchain)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 15 \
            -o /tmp/elan-init.sh https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          rm -f /tmp/elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pre-fetch Lean toolchain (retry flaky downloads)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if lake --version; then
              break
            elif [ "$i" -eq 5 ]; then
              echo "toolchain fetch failed after 5 attempts" >&2
              exit 1
            else
              sleep $((i * 5))
            fi
          done
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run the gate
        run: ./tools/check.sh
