name = "kalari"
version = "0.2.2"
defaultTargets = ["kalari", "kalari-aashaan", "Examples", "example-http", "example-jsonrpc", "example-curl"]

# The main service on the VM: MCP for the coding agent, HTTP for the web app,
# the orchestrator, the proved gate and the evidence store.
[[lean_exe]]
name = "kalari"
root = "Kalari.Main"

# The supervisor inside each microVM. Std only, so it stays small.
[[lean_exe]]
name = "kalari-aashaan"
root = "Aashaan.Main"

[[lean_lib]]
name = "Kalari"

# Verified examples for agents (docs/lean.md). Built and run by the gate, so they can't rot.
[[lean_lib]]
name = "Examples"

[[lean_exe]]
name = "example-http"
root = "Examples.HttpServer"

[[lean_exe]]
name = "example-jsonrpc"
root = "Examples.JsonRpc"

[[lean_exe]]
name = "example-curl"
root = "Examples.Curl"
